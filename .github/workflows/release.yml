name: Build release package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check firmware, installer and documentation
        run: python3 tools/check-release.py
      - name: Check configuration, network policy and frame handling
        run: |
          g++ -std=c++11 -I tools/tests tools/tests/config-and-frames.cpp -o /tmp/lorable-config
          /tmp/lorable-config
          g++ -std=c++11 -I tools/tests tools/tests/network-policy.cpp -o /tmp/lorable-network
          /tmp/lorable-network
          g++ -std=c++11 -I tools/tests/manager -I tools/tests tools/tests/network-manager.cpp -o /tmp/lorable-manager
          /tmp/lorable-manager
      - name: Check Milesight and TTN payload codec
        run: node tools/test-codec.cjs
      - name: Check complete firmware integrity
        run: python3 tools/test-update-bundle.py
      - name: Check socket and UART configuration
        run: python3 tools/test-portal-socket-budget.py
      - name: Check embedded web interface
        run: node tools/check-web-asset.mjs
      - name: Check SRAM updater
        run: |
          python3 -m pip install unicorn==2.1.4
          python3 tools/test-ram-loader.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Windows installer and recovery guards
        shell: powershell
        run: |
          ./tools/test-first-install.ps1
          ./tools/test-bundle-powershell.ps1
          ./installer/First-Install.ps1 -CheckOnly -Language EN
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./firmware/manifest.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          python3 tools/make-release-zip.py --output "dist/LoRaBLE-Remote-$VERSION-Windows.zip"
          gh release create "v$VERSION" --verify-tag --draft --title "Victron LoRaBLE Remote $VERSION — One file. USB or WiFi." --notes-file docs/RELEASE.md
          gh release upload "v$VERSION" "firmware/LoRaBLE-Remote-$VERSION.bin" "dist/LoRaBLE-Remote-$VERSION-Windows.zip" dist/SHA256SUMS
